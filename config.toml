# Configuración del asistente personal.
# Editá esto, no el código.

[identidad]
# Solo para el saludo y para elegir a quién se manda el iMessage.
apple_id = "TU-APPLE-ID@ejemplo.com"

[calendario]
# Calendarios que NO querés ver en el brief (cumpleaños, feriados de terceros…).
ignorar = ["Birthdays", "Cumpleaños", "Siri Suggestions", "Holidays"]

# Calendarios de perímetro CORPORATIVO (D29).
# De estos se leen SOLO título, horario y duración. Nunca notas, invitados,
# ubicación, adjuntos ni URL — el lector los descarta antes de componer.
corporativos = ["Trabajo", "Universidad", "Work"]

# Ventana del día que considerás "tu día" para calcular huecos libres.
hora_inicio = 8
hora_fin = 21

[recordatorios]
# Listas de Recordatorios a mirar. Vacío = todas.
listas = []
# Cuántos días hacia atrás se muestran los vencidos.
vencidos_dias = 14

[direccion]
# El experto en dirección de iniciativas (pm-assistant).
# Kraken le PREGUNTA; el experto nunca empuja. ROUTER.md §6.
# Dejalo vacío ("") para saltear la consulta.
state_dir = "~/projects/direction-state"
# El estado CORPORATIVO queda deliberadamente fuera (D29): se dirige desde la
# cuenta Team y kraken no lo alcanza. No agregues su ruta acá.

[compras]
# Lista canónica de compras: Recordatorios de Apple. Cookidoo es de dónde salen
# los ingredientes, no dónde vive la lista (una sola fuente por tipo de contenido).
lista = "Compras"

# Archivo que produce el asistente de cocina con lo que se cocina cada día.
# Formato en el docstring de compras.py. Si no existe, el brief lo saltea.
plan_comidas = "~/experts/cooking-kb/plan-comidas.yaml"

# ¿Mostrar "falta comprar" en el brief de la mañana?
en_brief = true

[entrega]
# Orden de entrega. Se ejecutan todas las que estén en la lista.
#   archivo_icloud   — escribe el brief en iCloud Drive (lo ves en Archivos del iPhone)
#   imessage         — te lo manda por iMessage a vos mismo → llega como notificación al teléfono
#   notificacion_mac — notificación local en el Mac (solo el resumen)
#   ntfy             — push vía ntfy.sh (TERCERO: leé perimetro_en_push antes de activarlo)
canales = ["archivo_icloud", "imessage"]

ruta_icloud = "~/Library/Mobile Documents/com~apple~CloudDocs/Brief"

# Solo si usás ntfy: el topic es tu única credencial, elegí algo impredecible.
ntfy_topic = ""

# ¿Pueden salir títulos de calendarios corporativos hacia un canal de TERCEROS
# (hoy: ntfy)? Default false = se redactan a "Reunión (Trabajo) 10:00–11:00".
# D29 permite esos títulos EN EL BRIEF; que salgan de Apple es otra cosa (P7).
perimetro_en_push = false
