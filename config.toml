# Configuración del asistente personal.
# Editá esto, no el código.

[identidad]
# Solo para el saludo y para elegir a quién se manda el iMessage.
apple_id = "TU-APPLE-ID@ejemplo.com"

[calendario]
# Calendarios que NO querés ver en el brief (cumpleaños, feriados de terceros…).
ignorar = ["Birthdays", "Cumpleaños", "Siri Suggestions", "Holidays"]

# Calendarios de perímetro CORPORATIVO (D29).
# De estos se leen SOLO título, horario y duración. Nunca notas, invitados,
# ubicación, adjuntos ni URL — el lector los descarta antes de componer.
corporativos = ["Trabajo", "Universidad", "Work"]

# Ventana del día que considerás "tu día" para calcular huecos libres.
hora_inicio = 8
hora_fin = 22

# Un evento de DÍA COMPLETO cuyo título contenga alguna de estas palabras
# cancela los compromisos fijos de ese día. Un feriado no te saca del
# calendario: te saca de la oficina.
anula_fijos = ["feriado", "licencia", "vacaciones", "franco", "asueto", "paro"]

# ── Compromisos fijos ───────────────────────────────────────────────────────
# Lo que estructura tu semana y NO vive como eventos en el calendario: el
# trabajo de oficina, las clases. Sin esto el brief diría "13 h libres" todos
# los días, que es falso.
#
#   dias         lu ma mi ju vi sa do
#   desde/hasta  HH:MM
#   desde_fecha / hasta_fecha  (opcional) para lo estacional
#
# El horario de oficina se parte en dos bloques para que el almuerzo aparezca
# como hueco real.

[[fijos]]
nombre = "Oficina"
dias = ["lu", "ma", "mi", "ju", "vi"]
desde = "08:00"
hasta = "12:45"

[[fijos]]
nombre = "Oficina"
dias = ["lu", "ma", "mi", "ju", "vi"]
desde = "13:45"
hasta = "17:00"

# Clases: solo de marzo a junio, y el horario todavía no está.
# Cuando lo tengas, descomentá, poné los días y las horas reales, y ajustá el
# horario de oficina de 2027 según la modificación que pidas.
#
# [[fijos]]
# nombre = "Clases"
# dias = ["lu", "mi"]
# desde = "18:00"
# hasta = "21:30"
# desde_fecha = "2027-03-01"
# hasta_fecha = "2027-06-30"

[recordatorios]
# Listas de Recordatorios a mirar. Vacío = todas.
listas = []
# Cuántos días hacia atrás se muestran los vencidos.
vencidos_dias = 14

[direccion]
# El experto en dirección de iniciativas (pm-assistant).
# Kraken le PREGUNTA; el experto nunca empuja. ROUTER.md §6.
# Dejalo vacío ("") para saltear la consulta.
state_dir = "~/projects/direction-state"
# El estado CORPORATIVO queda deliberadamente fuera (D29): se dirige desde la
# cuenta Team y kraken no lo alcanza. No agregues su ruta acá.

[compras]
# Lista canónica de compras: Recordatorios de Apple. Cookidoo es de dónde salen
# los ingredientes, no dónde vive la lista (una sola fuente por tipo de contenido).
lista = "Compras"

# Archivo que produce el asistente de cocina con lo que se cocina cada día.
# Formato en el docstring de compras.py. Si no existe, el brief lo saltea.
plan_comidas = "~/experts/cooking-kb/plan-comidas.yaml"

# ¿Mostrar "falta comprar" en el brief de la mañana?
en_brief = true

[higiene]
# Los buzones de captura: dónde tirás cosas rápido y hay que vaciar después.
#
# Kraken los CUENTA y nada más. No mira qué hay adentro, no ordena, no sugiere
# qué hacer con cada ítem — eso es una decisión de dominio y ROUTER.md se lo
# prohíbe. "Tenés 14 sin clasificar" es tu atención; "consolidá esas dos
# planillas" no es asunto suyo.
#
# Esto reemplaza la revisión semanal agendada: un evento de calendario te
# interrumpe todos los viernes aunque no haya nada, y nace de una segunda
# fuente de avisos (ROUTER.md §1 lo prohíbe). Acá aparece cuando hay motivo.
en_brief = false

# Lista de Recordatorios que usás como bandeja de entrada. "" para saltearla.
# Se cuentan los incompletos TENGAN O NO fecha: un buzón sin vaciar es
# justamente lo que entró y nunca recibió una.
inbox_recordatorios = "Inbox"

# Carpeta de Notas de Apple que usás como bandeja de entrada. "" para saltearla.
# Ojo: leerla ABRE la app Notes — AppleScript no tiene otra forma. Es lectura
# pura, no crea ni mueve ni borra nada.
inbox_notas = "Inbox"

# El buzón solo aparece si cruza ALGUNO de los dos umbrales. Debajo, silencio:
# un aviso que aparece todos los días deja de leerse a la semana.
umbral_items = 10
umbral_dias = 7

[entrega]
# Orden de entrega. Se ejecutan todas las que estén en la lista.
#   archivo_icloud   — escribe el brief en iCloud Drive (lo ves en Archivos del iPhone)
#   imessage         — te lo manda por iMessage a vos mismo → llega como notificación al teléfono
#   notificacion_mac — notificación local en el Mac (solo el resumen)
#   ntfy             — push vía ntfy.sh (TERCERO: leé perimetro_en_push antes de activarlo)
canales = ["archivo_icloud", "imessage"]

ruta_icloud = "~/Library/Mobile Documents/com~apple~CloudDocs/Brief"

# Solo si usás ntfy: el topic es tu única credencial, elegí algo impredecible.
ntfy_topic = ""

# ¿Pueden salir títulos de calendarios corporativos hacia un canal de TERCEROS
# (hoy: ntfy)? Default false = se redactan a "Reunión (Trabajo) 10:00–11:00".
# D29 permite esos títulos EN EL BRIEF; que salgan de Apple es otra cosa (P7).
perimetro_en_push = false
